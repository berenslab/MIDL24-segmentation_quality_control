[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "segmentation_quality_control"
dynamic = ["version"]
description = "MIDL 2024 paper: Efficiently correcting patch-based segmentation errors to control image-level performance in retinal images"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "timm>=0.9,<1.0",
    "numpy",
    "scipy",
    "scikit-learn",
    "opencv-python-headless",
    "pandas",
    "matplotlib",
    "pillow",
    "pyyaml",
    "munch",
]

[dependency-groups]
dev = [
    "jupyter",
    "ipython",
]

dev-bunch = [
    "jupyter",
    "ipython",
    "bunch",
]

[tool.hatch.build.targets.wheel]
packages = ["segmentation_quality_control"]

[tool.hatch.version]
path = "segmentation_quality_control/_version.py"

[tool.uv]
package = true
