[project]
name = "segmentation_quality_control"
version = "0.0.1"
description = "MIDL 2024 paper: Efficiently correcting patch-based segmentation errors to control image-level performance in retinal images"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "timm>=0.9,<1.0",
    "numpy",
    "scipy",
    "scikit-learn",
    "opencv-python-headless",
    "pandas",
    "matplotlib",
    "pillow",
    "pyyaml",
    "munch",
]

[dependency-groups]
dev = [
    "jupyter",
    "ipython",
    "bunch",
]

[tool.uv]
package = false